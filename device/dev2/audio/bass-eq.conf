# dev2 bass-EQ — PipeWire filter-chain for the HDMI → extractor → powered-speaker
# path (NO amp HAT, so dev1's Merus-specific tuning does not apply here).
#
# Creates a virtual sink `effect_input.bass_eq`; set it as the DEFAULT sink and
# Chromium's audio flows through this EQ, then out the HDMI sink explicitly
# (target.object below) → extractor → speakers. Bass-forward by design + a gentle
# treble tame so the low end feels bigger. Tune the Gain values by ear.
#
# Install: ~/.config/pipewire/filter-chain.conf.d/bass-eq.conf
# Apply:   systemctl --user restart pipewire wireplumber pipewire-pulse
#          wpctl set-default <effect_input.bass_eq id>
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Bass EQ"
            media.name       = "Bass EQ"
            filter.graph = {
                nodes = [
                    # Broad low-shelf lift — overall warmth/body.
                    {
                        type = builtin  name = bass_shelf  label = bq_lowshelf
                        control = { "Freq" = 120.0 "Q" = 0.7 "Gain" = 9.0 }
                    }
                    # Sub-bass punch — kick/bass-note weight.
                    {
                        type = builtin  name = sub_punch  label = bq_peaking
                        control = { "Freq" = 55.0 "Q" = 1.2 "Gain" = 5.0 }
                    }
                    # Gentle presence dip — pulls boxy mids back so bass sits forward.
                    {
                        type = builtin  name = presence_cut  label = bq_peaking
                        control = { "Freq" = 3000.0 "Q" = 0.8 "Gain" = -2.0 }
                    }
                    # Tame harsh top so the perceived balance is bassier.
                    {
                        type = builtin  name = high_shelf  label = bq_highshelf
                        control = { "Freq" = 6000.0 "Q" = 0.7 "Gain" = -3.0 }
                    }
                ]
                links = [
                    { output = "bass_shelf:Out"   input = "sub_punch:In" }
                    { output = "sub_punch:Out"    input = "presence_cut:In" }
                    { output = "presence_cut:Out" input = "high_shelf:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.bass_eq"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name     = "effect_output.bass_eq"
                node.passive  = true
                # Route the EQ output straight to the HDMI hardware sink (so making
                # effect_input.bass_eq the default can't create a feedback loop).
                target.object = "alsa_output.platform-3f902000.hdmi.hdmi-stereo"
            }
        }
    }
]
